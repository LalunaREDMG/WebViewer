<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Portal Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-animation"></div>
    <div class="futuristic-elements">
        <div class="robot" style="top: 15%; left: -60px;"></div>
        <div class="robot" style="top: 45%; left: -60px; animation-delay: -5s;"></div>
        <div class="robot" style="top: 75%; left: -60px; animation-delay: -10s;"></div>
        
        <div class="circuit" style="top: 10%; left: 10%;"></div>
        <div class="circuit" style="top: 60%; left: 70%;"></div>
        
        <div class="data-stream" style="left: 20%; animation-delay: -2s;"></div>
        <div class="data-stream" style="left: 40%; animation-delay: -4s;"></div>
        <div class="data-stream" style="left: 60%; animation-delay: -6s;"></div>
        <div class="data-stream" style="left: 80%; animation-delay: -8s;"></div>
        
        <div class="tech-icon tech-icon-1" style="top: 20%; left: 15%; animation-delay: -3s;"></div>
        <div class="tech-icon tech-icon-2" style="top: 70%; left: 85%; animation-delay: -7s;"></div>
        <div class="tech-icon tech-icon-1" style="top: 40%; left: 45%; animation-delay: -5s;"></div>

        <!-- Hologram Elements -->
        <div class="hologram" style="top: 20%; left: 10%;"></div>
        <div class="hologram" style="top: 60%; left: 80%;"></div>
        <div class="hologram" style="top: 30%; left: 50%;"></div>

        <!-- Digital Rain -->
        <div class="digital-rain" style="top: 0; left: 20%;">010110101</div>
        <div class="digital-rain" style="top: 0; left: 40%;">110010101</div>
        <div class="digital-rain" style="top: 0; left: 60%;">101011010</div>
        <div class="digital-rain" style="top: 0; left: 80%;">001101011</div>

        <!-- Cyber Circles -->
        <div class="cyber-circle" style="top: 30%; left: 20%; width: 100px; height: 100px;"></div>
        <div class="cyber-circle" style="top: 60%; left: 70%; width: 150px; height: 150px;"></div>
        <div class="cyber-circle" style="top: 40%; left: 40%; width: 80px; height: 80px;"></div>

        <!-- Scanner Lines -->
        <div class="scanner" style="top: 0;"></div>
        <div class="scanner" style="top: 0; animation-delay: -1s;"></div>
        <div class="scanner" style="top: 0; animation-delay: -2s;"></div>
    </div>
    <div class="sales-elements"></div>
    <div class="container">
        <div class="login-box">
            <h1>Sales Portal</h1>
            <form id="login-form" class="login-form">
                <div class="error-message" id="error-message"></div>
                <div class="input-group">
                    <input type="text" id="username" required placeholder="Username">
                </div>
                <div class="input-group">
                    <input type="password" id="password" required placeholder="Password">
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
        <div class="error-popup" id="error-popup">
            <div class="popup-content">
                <div class="popup-icon">❌</div>
                <h2>Invalid Credentials</h2>
                <p id="popup-message">Username or password is incorrect.</p>
                <button class="popup-close" onclick="closePopup()">Try Again</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
