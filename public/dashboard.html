<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>
    <link rel="stylesheet" href="/dashboard.css">
    <!-- Add Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="mobile-scroll">
    <div class="background-animation"></div>
    <div class="futuristic-elements">
        <!-- Keep the same futuristic elements from index.html -->
        <div class="hologram" style="top: 20%; left: 10%;"></div>
        <div class="hologram" style="top: 60%; left: 80%;"></div>
        <div class="cyber-circle" style="top: 30%; left: 20%; width: 100px; height: 100px;"></div>
        <div class="scanner" style="top: 0;"></div>
    </div>
    
    <div class="dashboard-container">
        <!-- Add menu toggle button for mobile -->
        <button class="menu-toggle" id="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="sidebar">
            <div class="user-profile">
                <div class="avatar">👤</div>
                <h3>Welcome Back</h3>
                <p id="username-display"></p>
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#"><span>📊</span>Dashboard</a></li>
                <li><a href="#"><span>📈</span>Sales</a></li>
                <li><a href="#"><span>👥</span>Customers</a></li>
                <li><a href="#"><span>📝</span>Reports</a></li>
                <li><a href="#"><span>⚙️</span>Settings</a></li>
                <li class="logout"><a href="#" id="logout-btn"><span>🚪</span>Logout</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <header>
                <h1>Sales Dashboard</h1>
                <div class="header-info">
                    <div class="connection-status">
                        <span class="status-icon"></span>
                        <span id="connection-text">Checking connection...</span>
                    </div>
                    <div class="date">📅 <span id="current-date"></span></div>
                </div>
            </header>
            
            <div class="dashboard-grid">
                <div class="card">
                    <h3>Total Sales</h3>
                    <p class="number" id="sales-amount">Loading...</p>
                    <span class="trend neutral">→ Loading...</span>
                </div>
                <div class="card">
                    <h3>Total Guest Count</h3>
                    <p class="number" id="guest-count">Loading...</p>
                    <span class="trend neutral" id="guest-trend">→ Loading...</span>
                </div>
                <div class="card">
                    <h3>Total Transactions</h3>
                    <p class="number" id="transaction-count">Loading...</p>
                    <span class="trend neutral" id="transaction-trend">→ Loading...</span>
                </div>
                <div class="card sales-chart-card">
                    <h3>Sales Trend</h3>
                    <canvas id="salesChart" width="400" height="200"></canvas>
                </div>
            </div>
        </main>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/dashboard.js"></script>
</body>
</html>
